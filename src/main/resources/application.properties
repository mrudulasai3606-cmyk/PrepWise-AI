spring.application.name=studyhelper

# Database (credentials come from environment variables, rule 7)
spring.datasource.url=jdbc:postgresql://localhost:5432/studyhelper
spring.datasource.username=postgres
spring.datasource.password=123456

# Let Hibernate create/update tables while we learn (we'll switch to migrations later)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload limits
app.upload.max-size-bytes=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB